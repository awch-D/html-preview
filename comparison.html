<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>月嫂个人网站 · 三种设计对比</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#eae9e6;color:#27272a}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #7755bb;outline-offset:3px}button{min-height:44px}.toolbar{height:88px;background:#fff;display:flex;justify-content:space-between;align-items:center;padding:0 27px;gap:22px;border-bottom:1px solid #d9d9d9;position:relative;z-index:5}.identity{display:flex;flex-direction:column;gap:5px;flex:none}.identity strong{font-size:15px;font-weight:650;letter-spacing:.5px}.identity span{font-size:10px;color:#92929a;letter-spacing:1px}.tabs{display:flex;gap:8px;align-items:center}.tab{border:1px solid transparent;background:none;display:flex;align-items:center;gap:10px;border-radius:9px;padding:10px 14px;text-align:left;transition:background .2s}.tab:hover{background:#f4f4f5}.tab[aria-pressed="true"]{background:#f3f3f4;border-color:#d9d9de}.swatch{width:27px;height:31px;flex:none;border-radius:4px;border:1px solid #00000010}.swatch.a{background:linear-gradient(90deg,#f8f5ef 50%,#b75e43 50%)}.swatch.b{background:linear-gradient(90deg,#112f28 50%,#c1ae82 50%)}.swatch.c{background:linear-gradient(90deg,#d7c8f8 50%,#f3f68e 50%)}.tab b{display:block;font-size:11px;font-weight:600;letter-spacing:.5px}.tab small{display:block;font-size:9px;color:#929299;margin-top:4px;white-space:nowrap}.tools{display:flex;align-items:center;gap:9px}.view-btn,.mode-btn{font-size:11px;border:1px solid #dcdcde;border-radius:6px;padding:10px 12px;background:#fff;white-space:nowrap}.view-btn[aria-pressed="true"],.mode-btn[aria-pressed="true"]{background:#27272a;border-color:#27272a;color:white}.view-btn:hover,.mode-btn:hover{border-color:#8a8a93}.device-controls{display:flex;gap:3px}.device-controls button{border:0;background:none;color:#999;min-width:39px;padding:10px 5px;font-size:10px}.device-controls button[aria-pressed="true"]{color:#222;font-weight:650}.device-controls button:disabled{opacity:.4;cursor:not-allowed}.stage{height:calc(100dvh - 88px);position:relative;overflow:hidden;display:flex;justify-content:center;align-items:center}.page-frame{border:0;width:100%;height:100%;display:block;background:#f8f5ef}.stage.mobile{padding:21px}.stage.mobile .page-frame{width:390px;max-width:100%;height:100%;border-radius:24px;box-shadow:0 0 0 6px #303033,0 15px 45px #0002}.stage.compare{display:block;overflow:auto;padding:38px 25px}.compare-title{max-width:1560px;margin:0 auto 22px;display:flex;justify-content:space-between;align-items:end;gap:18px}.compare-title h1{font-size:20px;letter-spacing:.5px;margin:0 0 8px;font-weight:600}.compare-title p{font-size:11px;color:#7b7b82;margin:0;line-height:1.8}.compare-title>span{font-size:10px;color:#8b8b91;white-space:nowrap}.compare-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;max-width:1560px;margin:0 auto}.compare-card{background:white;min-width:0;border:1px solid #d6d6d9;border-radius:9px;overflow:hidden;box-shadow:0 3px 10px #00000004}.mini-head{display:flex;align-items:center;gap:5px;height:27px;padding:0 10px;background:#fafafa;border-bottom:1px solid #e1e1e4}.mini-head i{width:5px;height:5px;background:#d6d6db;border-radius:50%;display:block}.mini-head span{margin-left:auto;font-size:8px;color:#97979f}.mini-stage{position:relative;height:540px;overflow:hidden;background:#efeee9}.mini-stage iframe{width:1440px;height:1940px;border:0;transform-origin:top left;pointer-events:none}.preview-open{position:absolute;inset:0;border:0;background:transparent;width:100%;height:100%;cursor:zoom-in}.preview-open:hover{box-shadow:inset 0 0 0 2px #7775}.card-meta{padding:19px 18px 17px}.card-meta .number{font:11px Georgia;color:#8b8b93}.card-meta h2{font-size:18px;margin:7px 0 10px;letter-spacing:.5px;font-weight:600}.card-meta p{font-size:10px;color:#888890;line-height:1.9;margin:0;min-height:38px}.card-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:20px;gap:8px}.chips{display:flex;gap:5px;flex-wrap:wrap}.chips span{font-size:9px;background:#f4f4f4;border-radius:3px;padding:4px 6px;color:#77777d}.explore{padding:8px 12px;border:1px solid #dddde1;border-radius:5px;background:white;font-size:10px;white-space:nowrap}.explore:hover{background:#2b2b2e;color:#fff;border-color:#2b2b2e}.noscript{padding:30px}.status{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
@media(max-width:1150px){.toolbar{padding:0 18px;gap:12px}.identity span{display:none}.tab{padding:10px}.tab small{display:none}.swatch{width:20px;height:25px}.tools{gap:6px}.compare-grid{gap:14px}.card-meta{padding:15px 12px}.chips span{font-size:8px}.card-bottom{flex-wrap:wrap}}
@media(max-width:800px){.toolbar{height:112px;flex-wrap:wrap;padding:12px 15px;gap:8px}.identity{order:0;flex:1}.identity strong{font-size:13px}.tools{order:1}.tabs{order:2;width:100%;justify-content:space-between;gap:5px}.tab{justify-content:center;flex:1;min-width:0;min-height:43px;padding:8px 6px;gap:6px}.tab b{font-size:10px}.swatch{width:17px;height:22px}.view-btn,.mode-btn{padding:8px 10px;font-size:10px;min-height:36px}.device-controls button{min-height:36px}.stage{height:calc(100dvh - 112px)}.stage.compare{padding:25px 16px}.compare-title>span{display:none}.compare-title h1{font-size:18px}.compare-grid{grid-template-columns:1fr;gap:25px;max-width:520px}.card-meta{padding:20px}.card-bottom{flex-wrap:nowrap}.card-meta p{min-height:0}.mini-stage{max-height:610px}.stage.mobile{padding:16px 12px}.stage.mobile .page-frame{border-radius:18px}.identity span{display:none}}
@media(max-width:390px){.device-controls{display:none}.identity strong{font-size:12px}.tab b{font-size:9px}.tab{gap:5px}.toolbar{padding:12px 10px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head><body>
<header class="toolbar"><div class="identity"><strong>月嫂个人网站</strong><span>三个方向，同一份用心。</span></div><nav class="tabs" aria-label="选择设计方案"><button class="tab" data-design="a" aria-pressed="false"><span class="swatch a"></span><span><b>01 暖白杂志</b><small>留白 · 宋体 · 生活感</small></span></button><button class="tab" data-design="b" aria-pressed="false"><span class="swatch b"></span><span><b>02 深绿高端</b><small>沉浸 · 大图 · 私人照护</small></span></button><button class="tab" data-design="c" aria-pressed="false"><span class="swatch c"></span><span><b>03 活力色块</b><small>拼贴 · 个性 · 亲和力</small></span></button></nav><div class="tools"><div class="device-controls" aria-label="预览宽度"><button data-device="desktop" aria-pressed="true">电脑</button><button data-device="mobile" aria-pressed="false">手机</button></div><button class="mode-btn" id="compare-button" aria-pressed="true">三屏对比</button></div></header>
<main class="stage" id="stage"></main><div class="status" role="status" id="status"></div><noscript><div class="noscript">请启用浏览器 JavaScript，以切换三套页面。</div></noscript>
<script>
const pages=__PAGES__;
const designs=[{id:'a',title:'暖白杂志',subtitle:'像翻开一本温柔的生活杂志，让个人故事成为视觉主角。',tags:['奶油白 × 陶土色','错位排版','弧形肖像']},{id:'b',title:'深绿高端',subtitle:'深色沉浸画面与克制的细节，呈现安静、专业的私人照护。',tags:['森林绿 × 黄铜色','沉浸全幅','纵向边栏']},{id:'c',title:'活力色块',subtitle:'明亮的色块与不规则拼贴，像一位亲切生活搭档的工作手记。',tags:['香芋紫 × 柠檬黄','非对称拼贴','个人侧栏']}];
let current='a',device='desktop',compare=true;
const stage=document.getElementById('stage');
function makeFrame(id,title){const frame=document.createElement('iframe');frame.title=title;frame.className='page-frame';frame.srcdoc=pages[id];frame.setAttribute('sandbox','allow-scripts allow-same-origin allow-forms');return frame}
function updateToolbar(){document.querySelectorAll('[data-design]').forEach(button=>button.setAttribute('aria-pressed',String(!compare&&button.dataset.design===current)));document.querySelectorAll('[data-device]').forEach(button=>{button.setAttribute('aria-pressed',String(button.dataset.device===device));button.disabled=compare});document.getElementById('compare-button').setAttribute('aria-pressed',String(compare));document.getElementById('status').textContent=compare?'正在并排展示三套设计。':'当前设计：'+designs.find(item=>item.id===current).title+'，'+(device==='mobile'?'手机宽度。':'电脑宽度。')}
function scaleMiniatures(){document.querySelectorAll('.mini-stage').forEach(box=>{const scale=box.clientWidth/1440;box.querySelector('iframe').style.transform='scale('+scale+')';box.style.height=(1940*scale)+'px'})}
function showDesign(id){current=id;compare=false;stage.className='stage'+(device==='mobile'?' mobile':'');stage.replaceChildren(makeFrame(id,designs.find(item=>item.id===id).title+'完整页面'));history.replaceState(null,'','#'+id);updateToolbar()}
function showComparison(){compare=true;stage.className='stage compare';stage.replaceChildren();const heading=document.createElement('header');heading.className='compare-title';heading.innerHTML='<div><h1>不只是换色，是三种不同的表达。</h1><p>点击任意页面进入完整浏览，查看作品筛选、服务经历和沟通表单。</p></div><span>同一份内容 · 三种视觉方向</span>';stage.append(heading);const grid=document.createElement('div');grid.className='compare-grid';for(const [index,item] of designs.entries()){const card=document.createElement('article');card.className='compare-card';const chrome=document.createElement('div');chrome.className='mini-head';chrome.innerHTML='<i></i><i></i><i></i><span>设计 0'+(index+1)+'</span>';const box=document.createElement('div');box.className='mini-stage';const frame=makeFrame(item.id,item.title+'缩略预览');frame.tabIndex=-1;box.append(frame);const open=document.createElement('button');open.className='preview-open';open.setAttribute('aria-label','展开'+item.title+'完整页面');open.addEventListener('click',()=>showDesign(item.id));box.append(open);const meta=document.createElement('div');meta.className='card-meta';meta.innerHTML='<span class="number">方案 0'+(index+1)+'</span><h2>'+item.title+'</h2><p>'+item.subtitle+'</p><div class="card-bottom"><div class="chips">'+item.tags.map(tag=>'<span>'+tag+'</span>').join('')+'</div><button class="explore">展开浏览 ↗</button></div>';meta.querySelector('button').addEventListener('click',()=>showDesign(item.id));card.append(chrome,box,meta);grid.append(card)}stage.append(grid);history.replaceState(null,'','#compare');updateToolbar();requestAnimationFrame(scaleMiniatures)}
document.querySelectorAll('[data-design]').forEach(button=>button.addEventListener('click',()=>showDesign(button.dataset.design)));
document.querySelectorAll('[data-device]').forEach(button=>button.addEventListener('click',()=>{device=button.dataset.device;showDesign(current)}));
document.getElementById('compare-button').addEventListener('click',showComparison);
window.addEventListener('resize',()=>{if(compare)scaleMiniatures()});
const initial=location.hash.slice(1);if(designs.some(item=>item.id===initial))showDesign(initial);else showComparison();
</script></body></html>
